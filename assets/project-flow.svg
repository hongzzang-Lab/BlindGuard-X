 <text x="81" y="47" fill="#24292f" font-size="22" font-weight="700">Raspberry Pi 5</text>
 <path d="M23 73H302" stroke="#d0d7de"/>
 <text x="22" y="112" fill="#24292f" font-size="24" font-weight="700">Edge Vision</text>
 <text x="22" y="152" fill="#57606a" font-size="17">Two fixed cameras: YOLO26n</text>
 <text x="22" y="179" fill="#57606a" font-size="17">with ROI Packing, ByteTrack,</text>
 <text x="22" y="206" fill="#57606a" font-size="17">and ground-plane homography</text>
</g>
<g transform="translate(382 185)">
 <rect width="326" height="250" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
