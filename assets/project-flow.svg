<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-label="Project flow from edge vision on a Raspberry Pi 5 through per-vehicle risk decision and CARLA demonstration to public-dataset evaluation">
