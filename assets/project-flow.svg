<text x="34" y="110" fill="#24292f" font-size="38" font-family="Arial,Helvetica,sans-serif" font-weight="700">From Roadside Camera to Driver Alert</text>
<text x="35" y="147" fill="#57606a" font-size="18" font-family="Arial,Helvetica,sans-serif">A roadside edge-AI warning system for blind-spot crosswalks</text>
<g font-family="Arial,Helvetica,sans-serif">
<g transform="translate(34 185)">
