 <rect x="22" y="21" width="45" height="38" rx="9" fill="#dafbe1"/><text x="44.5" y="46" text-anchor="middle" fill="#1a7f37" font-weight="700" font-size="17">02</text>
 <text x="81" y="47" fill="#24292f" font-size="22" font-weight="700">Server</text>
 <path d="M23 73H302" stroke="#d0d7de"/>
 <text x="22" y="112" fill="#24292f" font-size="24" font-weight="700">Risk Decision</text>
